[package]
name = "JGrep3"
version = "0.1.1"
edition = "2024"
license = "MIT"

[lib]
name = "jgrep3"
path = "src/lib.rs"

[[bin]]
name = "JGrep3"
path = "src/main.rs"

[dependencies]
native-windows-gui = { version = "1.0.12", features = ["combobox", "list-view", "tree-view", "menu", "status-bar", "image-list", "cursor", "file-dialog", "frame", "high-dpi", "progress-bar"] }
native-windows-derive = "1.0.5"
memchr = "2"
regex = "1.10"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
windows = { version = "0.58", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
